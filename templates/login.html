
{% extends "layout.html" %}

{% block title %}Log in - Annotation{% endblock %}

{% block content %}

<h1 class="title">Log in</h1>

<form method="post">

  <div class="row">

    <label for="username">Username</label>

    <input id="username" name="username" value="{{ form.username }}" required>

  </div>


  <div class="row">

    <label for="password">Password</label>

    <input id="password" name="password" type="password" required>

  </div>


  <div class="btns">

    <button class="btn dark" type="submit">Log in</button>

  </div>

  <p class="help">Don't have an account? <a href="{{ url_for('auth.register') }}">Register here</a></p>

</form>

{% endblock %}
