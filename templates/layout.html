<!doctype html>
<html lang="en">



<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Annotation{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>



<body>

  <header class="top">

    <a href="{{ url_for('books.home') }}">Annotation</a>

    {% if current_user.is_authenticated %}
    <span class="me">{{ current_user.username[:18] }} · <a href="{{ url_for('auth.logout') }}">Log out</a></span>
    {% else %}
    <a class="me" href="{{ url_for('auth.login', next=request.path) }}">Log in</a>
    {% endif %}


  </header>



  <main class="main">
    {%block content%}{%endblock%}
  </main>




  
  <nav class="tabs">
    <a class="tab {% if request.blueprint == 'books' %}on{% endif %}" href="{{ url_for('books.home') }}">Books</a>
    <a class="tab {% if request.blueprint == 'search' %}on{% endif %}" href="{{ url_for('search.search') }}">Search</a>
    <a class="tab {% if request.path == '/notebook' %}on{% endif %}" href="{{ url_for('notes.my_notes') }}">Notebook</a>
  </nav>

</body>



</html>
