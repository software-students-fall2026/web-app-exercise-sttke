<!doctype html>
<html lang="en">



<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Annotation{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>



<body>

  <header class="top">

    <a href="{{ url_for('books.home') }}">Annotation</a>

    {% if current_user.is_authenticated %}
    <span class="me">{{ current_user.username[:18] }} | <a href="{{ url_for('auth.logout') }}">Log out</a></span>
    {% else %}
    <span class="me"><a href="{{ url_for('auth.login') }}">Log in</a></span>
    {% endif %}


  </header>



  <main>
    {%if errors%}
    {%for error in errors%}
    <p class="errs">{{ error }}</p>
    {%endfor%}
    {%endif%}
    {%block content%}{%endblock%}
  </main>




  
  <nav>
    <a class="{% if request.path == '/' or request.path.startswith('/books') %}on{% endif %}" href="{{ url_for('books.home') }}">Books</a>
    <a class="{% if request.path == '/search' %}on{% endif %}" href="{{ url_for('search.search') }}">Search</a>
    <a class="{% if request.path == '/notebook' %}on{% endif %}" href="{{ url_for('notes.my_notes') }}">Notebook</a>
  </nav>

</body>



</html>
