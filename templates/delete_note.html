{% extends "base.html" %}
{% block title %}Delete note · Annotation{% endblock %}
{% block content %}
<h1 class="page-title">Delete {{ 'reply' if note.reply_to else 'note' }}?</h1>
<article class="note"><p class="note-body">{{ note.body }}</p></article>
{% if not note.reply_to %}<p>Deleting this note also removes its replies.</p>{% endif %}
<form method="post"><div class="form-actions"><button class="btn btn-primary" type="submit">Delete</button><a class="btn btn-ghost" href="{{ url_for('notes.detail', note_id=note._id) }}">Cancel</a></div></form>
{% endblock %}
