{% extends "layout.html" %}








{%block content%}




{%for g in courses%}
<section>

  <h2>{{ g.course }}</h2>


  {% for b in g.books %}
  <a class="bk" href="{{ url_for('books.show', book_id=b._id) }}">

    <p>Notes: {{ b.count }}</p>

    <h3>{{ b.title }}</h3>
    <p>{{ b.authors }}</p>
    
    <p>Check your copy: {{ b.call_number }} - {{ b.location }}</p>
  </a>
  {%endfor%}



</section>
{%endfor%}





{%endblock%}
