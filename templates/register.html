
{% extends "layout.html" %}

{% block title %}Register - Annotation{% endblock %}

{% block content %}

<h1 class="title">Create an account</h1>

<form method="post">


  <div class="row">


    <label for="username">Username</label>


    <input id="username" name="username" value="{{ form.username }}" required>
  </div>


  <div class="row">


    <label for="password">Password</label>

    <input id="password" name="password" type="password" required>
  </div>


  <div class="row">

    <label for="confirm_password">Confirm password</label>


    <input id="confirm_password" name="confirm_password" type="password" required>

  </div>


  <div class="btns">

    <button class="btn dark" type="submit">Register</button>

  </div>

  <p class="help">Already have an account? <a href="{{ url_for('auth.login') }}">Log in here</a></p>

</form>

{% endblock %}
